buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// On Windows, ninja rejects any path over 260 characters, and the native
// (CMake) build of every library module writes under node_modules/<lib>/android/.cxx,
// which with a long project path overflows that limit (the release variant name
// "RelWithDebInfo" alone was enough to break @react-native-community/javascriptcore).
// Keep each module's native build under a short path instead.
// The app module does the same in app/build.gradle.
if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    def shortCxxRoot = "${System.getProperty('user.home')}/.cxx/gaincafecrm"
    subprojects { sub ->
        sub.plugins.withId("com.android.library") {
            sub.android.externalNativeBuild.cmake.buildStagingDirectory =
                sub.file("${shortCxxRoot}/${sub.name}")
        }
    }
}
